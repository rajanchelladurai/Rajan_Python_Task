{% extends "base.html" %}

{% block content %}

<style>
    table tr th {
        font-size:14px;
    }
    table tr td {
        font-size:14px;
    }
    .btn{
        font-size:14px;
        color:white;
    }
    .h1{
        text-align:center;
        color:white;
    }
    		.header {
		  overflow: hidden;
		  padding:3px 12px;
		  background-color:brown;
		  box-shadow:0px 2px 12px 0px rgba(0,0,0,0.9);
		}
		.header a {
		  float: left;
		  color:white;
		  text-align: center;
		  padding: 2px 19px;
		  text-decoration: none;
		  font-family: Arial, Helvetica, sans-serif;
		  font-weight:bold;
		  font-size: 17px;
		}
		.table-heading {
			margin-left:auto;
			margin-right:auto;
			padding:6px;
		}
		.table input{
			border-radius:5px;
			padding:7px 20px;
			border-width: 0px;
		}

		.footer {
			padding:2px 19px;
			float:right;

		}
		.search{
			background-color:white;
			padding:3px;
		  	box-shadow:0px 2px 8px 0px rgba(0,0,0,0.7);
		}
		.img-center{
			text-align:center;
		}
		.sticky{
			position:fixed;
			top:0;
			width:100%;
		}
		.sticky + .content {
  			padding-top: 102px;
		}
</style>
<body style="padding:0px; margin:0; background-color:#2c4266">

</body>

<div class="head" id="company_header">
	<div class="header">
		<img src="{{ url_for('static', filename='images/bank-account.png') }}" width="80px;" height="50px;" alt="My Image">
        <a href="#" ><h1 style="text-align:left; color:white;">Bank Account Details</h1></a>
	  </div>
</div>

<div style="text-align:center;" >
     <img src="{{ url_for('static', filename='images/bank.jpg') }}" alt="My Image">
</div>
<table border="1" class="table table-striped" width="100%">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Place</th>
    </tr>
    {% for item in items %}
    <tr>
        <td>{{ item[0] }}</td>
        <td>{{ item[1] }}</td>
         <td>{{ item[3] }}</td>
        <td>
            <a  class="btn btn-primary" href="{{ url_for('check_balance', id=item[0]) }}">Check Balance</a>
            <button class="btn btn-success" onclick="openPopup({{ item[0] }})">Withdrawal</button>
            <a class="btn btn-info" href="{{ url_for('add_item') }}">Depositing</a>
        </td>
    </tr>
    {% endfor %}
</table>
    <!-- Popup Modal -->
<form method="POST">
<form>
    <div id="popupModal" class="modal" tabindex="-1" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Withdrawal Details</h5>
                    <button type="button" class="btn-close" onclick="closePopup()"></button>
                </div>
                <div class="modal-body">
                    <p id="balanceText">Loading balance...</p>
                    <label for="withdrawalAmount">Enter Amount:</label>
                    <input type="number" id="withdrawalAmount" name = "withdrawalAmount" class="form-control" placeholder="Enter withdrawal amount" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="submitWithdrawal()">Submit</button>
                    <button type="button" class="btn btn-secondary" onclick="closePopup()">Close</button>
                </div>
            </div>
        </div>
    </div>
</form>
</form>
    <script>
 var selectedId = null;  // Variable to store the selected ID

    // Function to open the modal and store the selected ID
    function openPopup(id) {
        selectedId = id;  // Store the selected ID
        document.getElementById("popupModal").style.display = "block";  // Show the modal
    }

    // Function to close the modal
    function closePopup() {
        document.getElementById("popupModal").style.display = "none";  // Hide the modal
    }

    // Function to submit the withdrawal request
    function submitWithdrawal() {
        var withdrawalAmount = document.getElementById("withdrawalAmount").value;

        // Check if withdrawalAmount is provided
        if (!withdrawalAmount || withdrawalAmount <= 0) {
            alert("Please enter a valid withdrawal amount.");
            return;
        }

        // Create the data object to be sent with the POST request
        var data = {
            withdrawalAmount: withdrawalAmount,
            id: selectedId  // Pass the selected ID
        };

        // Send the data using an AJAX POST request
        fetch("/submit_withdrawal/" + selectedId, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)  // Convert the data object to JSON
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);  // Show the response message
            closePopup();  // Close the modal
        })
        .catch(error => {
            console.error('Error:', error);
            alert("An error occurred. Please try again.");
        });
    }

    </script>
{% endblock %}
